[package]
name = "ksg-custody-proc-v2"
description = "The issuer's key split and joined in a short-lived, hardened process: no core dump, no swap, no debugger of the same user"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license-file           = "../../LICENSE-PROPRIETARY"
publish                = false
repository.workspace   = true

[[bin]]
name = "ksg-custody"
path = "src/main.rs"

[dependencies]
ksg-custody-v2 = { path = "../ksg-custody-v2" }
hex.workspace     = true
zeroize.workspace = true
rand_core = { version = "0.6", features = ["getrandom"] }
# The three system calls of `harden.rs` and nothing else.
libc = "0.2"

[lints.rust]
missing_docs = "warn"
# `harden.rs` is the one module allowed `unsafe`, and says so itself.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
