[package]
name = "ksg-capsule-module"
description = "The container's code as a WebAssembly module inside the capsule: a session of presses, randomness and time from the reader ([doc:CAPSULE-SPEC] §10 p. 3)"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license-file           = "../../LICENSE-PROPRIETARY"
publish                = false
repository.workspace   = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ksg-container-v2 = { path = "../ksg-container-v2" }
ksg-core-v2 = { path = "../ksg-core-v2" }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
zeroize.workspace = true
# The map's public halves are rebuilt from the capsule into a `SealTo`
# (`ksg_container_v2::layers`), and the FROST rounds take `rand_core`'s traits.
x25519-dalek.workspace = true
# The phone↔reader pairing is SPAKE2 (И19-ф1): no unauthenticated DH.
spake2 = { version = "0.4", default-features = false, features = ["std"] }
hmac = "0.12"
subtle = "2"
hkdf.workspace = true
sha2.workspace = true
chacha20poly1305.workspace = true
rand_core = { version = "0.6" }
# Outside the capsule the operating system is the CSPRNG; inside it, the
# reader's `ksg_host.random` is (see the wasm32 section below).
getrandom = "0.2"

[dev-dependencies]
# The K4 test parses the built module's import section.
wasmparser = "0.221"

[lints.rust]
missing_docs = "warn"
# The module's boundary is raw memory: exported functions and the two host
# imports. `unsafe` is allowed in `abi.rs` alone and denied everywhere else.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

# Inside the capsule the container's randomness is the reader's (`ksg_host.random`):
# the module registers it as getrandom's custom source (Spec_kapsula §5).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["custom"] }
