[package]
name = "ksg-mobile-v2"
description = "The client's mobile half on core v2, as a library for the phone: the signing session, the holder's consent, the wire"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license-file           = "../../LICENSE-PROPRIETARY"
publish                = false
repository.workspace   = true

[lib]
name = "ksg_mobile_v2"

[dependencies]
ksg-core-v2 = { path = "../ksg-core-v2" }
ksg-container-v2 = { path = "../ksg-container-v2" }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
# rand_core 0.6 is what frost-ed25519 takes.
rand_core = { version = "0.6" }

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
