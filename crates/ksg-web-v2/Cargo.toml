[package]
name = "ksg-web-v2"
description = "The client's mobile half on core v2 in a browser: WebAssembly over ksg-mobile-v2, the holder's consent on the page, the reader's round over HTTP"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license-file           = "../../LICENSE-PROPRIETARY"
publish                = false
repository.workspace   = true

[lib]
name = "ksg_web_v2"
# cdylib for the browser (wasm32), rlib for the tests and the reader's tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
ksg-container-v2 = { path = "../ksg-container-v2" }
ksg-mobile-v2 = { path = "../ksg-mobile-v2" }
serde_json.workspace = true
base64.workspace = true
# In a browser the randomness comes from `crypto.getRandomValues` (the `js`
# feature acts on wasm32 only).
getrandom = { version = "0.2", features = ["js"] }
rand_core = { version = "0.6", features = ["getrandom"] }
wasm-bindgen = "0.2"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"

[dev-dependencies]
ksg-core-v2 = { path = "../ksg-core-v2" }
