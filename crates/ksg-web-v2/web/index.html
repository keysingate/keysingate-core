<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keys in Gate — mobile half</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0 auto; max-width: 40rem; padding: 1rem; }
  pre { white-space: pre-wrap; word-break: break-all; background: #f4f4f4; padding: .5rem; }
  button { font-size: 1rem; margin-right: .5rem; }
  [hidden] { display: none; }
</style>
<h1>Mobile half</h1>
<p>Pick the file of your half. It stays in this page's memory and is not sent anywhere.</p>
<input type="file" id="half">
<p id="state">no half loaded</p>
<div id="ask" hidden>
  <p>The reader asks you to sign:</p>
  <pre id="what"></pre>
  <button id="yes">Sign</button><button id="no">Refuse</button>
</div>
<script type="module">
import init, { WebHalf, describe } from './pkg/ksg_web_v2.js';
await init();
const token = new URLSearchParams(location.search).get('t');
const q = '?t=' + encodeURIComponent(token ?? '');
const $ = (id) => document.getElementById(id);
let half = null;

$('half').onchange = async (e) => {
  try {
    half = new WebHalf(new Uint8Array(await e.target.files[0].arrayBuffer()));
    $('state').textContent = 'half loaded; waiting for the reader';
    poll();
  } catch (err) { $('state').textContent = String(err); }
};

const word = () => new Promise((resolve) => {
  $('ask').hidden = false;
  $('yes').onclick = () => { $('ask').hidden = true; resolve(true); };
  $('no').onclick = () => { $('ask').hidden = true; resolve(false); };
});

async function poll() {
  for (;;) {
    let r;
    try { r = await fetch('/next' + q, { cache: 'no-store' }); }
    catch { $('state').textContent = 'the reader is gone'; return; }
    if (r.status === 403) { $('state').textContent = 'the address has no valid token'; return; }
    if (r.status !== 200) { await new Promise((s) => setTimeout(s, 300)); continue; }
    const line = await r.text();
    const what = describe(line);
    // A commitment signs nothing and needs no word; a round shows what it signs.
    let ok = true;
    if (what !== undefined && what !== null) {
      $('what').textContent = JSON.stringify(JSON.parse(what), null, 2);
      ok = await word();
    }
    await fetch('/answer' + q, { method: 'POST', body: half.answer(line, ok) });
    $('state').textContent = ok ? 'answered; waiting for the reader' : 'refused';
  }
}
</script>
</html>
